<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0D0F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Foco">
<title>Foco</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="application-name" content="Foco">
<script>
  window.FOCO_VERSAO = '20261030215447';
  // aplica o tema antes de pintar, sem flash
  try{var t=localStorage.getItem('foco-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-app',t)}catch(e){}
</script>
<link rel="stylesheet" href="styles.css?v=20261030215447">
</head>
<body>

<section id="login" hidden>
  <div class="login-card login-in">
    <div class="login-mark" style="--i:0">
      <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="17" stroke="var(--surface2)" stroke-width="6" fill="none"/><circle id="loginRing" cx="22" cy="22" r="17" stroke="var(--accent)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="106.8" stroke-dashoffset="106.8" style="transition:stroke-dashoffset 1.4s var(--ease) .3s"/></svg>
    </div>
    <h1 style="--i:1">Foco</h1>
    <p style="--i:2">Clientes, atendimentos, treino, alimentação e estudos num lugar só.</p>
    <div class="login-feats" style="--i:3"><span>Funil de vendas</span><span>Google Agenda</span><span>Peso e macros</span><span>Leitura e cursos</span></div>
    <button class="gbtn" id="btnLogin" style="--i:4">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h6a5 5 0 0 1-2.2 3.3v2.7h3.5c2-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.7H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14c-.2-.7-.4-1.4-.4-2.1s.1-1.4.4-2.1V7H2.1a11 11 0 0 0 0 9.9L5.7 14z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.3 1.7l3.2-3.2A11 11 0 0 0 2.1 7l3.6 2.8C6.6 7.3 9.1 5.4 12 5.4z"/></svg>
      Entrar com Google
    </button>
    <div class="login-err" id="loginErr" style="--i:5"></div>
  </div>
</section>

<div id="shell" hidden>
  <div id="app"><main id="view"></main></div>
  <nav class="tabs" aria-label="Seções">
    <div class="tabs-in" id="tabs">
      <span class="pill-bg" id="tabPill"></span>
    </div>
  </nav>
</div>

<div id="sheetWrap" hidden>
  <div class="scrim" data-act="closeSheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <div class="sheet-h"><h3 id="sheetTitle"></h3><button class="round ghost" data-act="closeSheet" aria-label="Fechar"><svg class="i s" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="sheet-b" id="sheetBody"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"><span class="ic"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><span id="toastMsg"></span></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js?v=20261030215447"></script>
<script src="app.js?v=20261030215447"></script>
</body>
</html>

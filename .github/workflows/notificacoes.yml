name: Notificações do Foco
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency: notificacoes
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: robo
      - run: node enviar.mjs
        working-directory: robo
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
